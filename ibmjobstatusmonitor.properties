# IBM i Connection Details
ibmi.host=
ibmi.user=
ibmi.password=
client.name=

# Alert threshold: send email when a job has been in MSGW longer than this (seconds)
# Default: 300 seconds (5 minutes)
msgw.threshold.seconds=300

# Monitor interval in milliseconds (60000 = 1 minute)
monitor.interval.ms=60000

# Prometheus metrics port
metrics.port=3018

# Optional path to a logo image file (jpg or png). Falls back to embedded logo if not set or file missing.
logo.path=..\..\logo\IPLogo.jpg
