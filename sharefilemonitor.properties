# ShareFile FTPS Monitor Configuration
# Connects via implicit SSL on port 990

# FTPS connection details
ftp.host=
ftp.username=
ftp.password=

# How often to poll ShareFile folders (minutes)
monitor.interval.minutes=5

# Consecutive breaches before alert email fires
alert.window.size=3

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# Optional path to logo image (PNG or JPG). Falls back to embedded default if absent.
logo.path=..\..\logo\IPLogo.jpg

# Prometheus metrics port
metrics.port=4017

# --- Monitored folders ---
# Add one block per ShareFile folder. Replace FOLDER_CODE with a unique identifier (no spaces).
# .name                   — display name used in alert emails
# .path                   — full FTPS path to the folder
# .min.files              — alert if count drops below this (default: 0)
# .max.files              — alert if count exceeds this (default: unlimited)
# .ignore.zero.file.alert — suppress alert when count is zero (default: false)
#
# Example:
# sf.folder.ORDERS.name=Daily Orders
# sf.folder.ORDERS.path=/client/IMPORT/ORDERS
# sf.folder.ORDERS.min.files=0
# sf.folder.ORDERS.max.files=500
# sf.folder.ORDERS.ignore.zero.file.alert=false

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
