# Server Uptime Monitor Configuration

# Prometheus metrics port
metrics.port=4014

# How often to ping servers (seconds)
ping.interval.seconds=10

# Client name shown in alert email subject lines
client.name=

# Optional: override the hostname shown in alert emails (defaults to machine hostname)
monitor.host.name=

# Path to email configuration file
email.config.path=email.properties

# Comma-separated list of hostnames or IP addresses to monitor
# Example:
# servers.list=SERVER1,SERVER2,10.0.0.5
servers.list=

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
