# Folder Log Keyword Monitor Configuration
# Scans files in one or more folders for keywords — alerts once per file version (re-alerts if the file is overwritten with a newer modified time)

# Prometheus metrics port
metrics.port=4016

# How often to scan the folder (minutes)
check.interval.minutes=60

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# Optional path to logo image (PNG or JPG). Falls back to embedded default if absent.
logo.path=..\..\logo\IPLogo.jpg

# Folders to monitor (comma-separated for multiple folders)
# Example:
# monitor.folder.paths=C:\\Logs\\MyFolder,D:\\IPSA\\Logs
monitor.folder.paths=C:\\Logs\\Errors

# Keywords to search for (comma-separated)
# Example:
# monitor.keywords=ERROR,FATAL,Exception,FAILED
monitor.keywords=ERROR,FATAL,Exception,FAILED

# Case sensitive keyword matching (true/false)
monitor.case.sensitive=false

# Scan subfolders recursively (true/false). false = only files directly in the folder
monitor.recursive=false

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
