# Log Keyword Monitor Configuration

# Prometheus metrics port
metrics.port=4013

# How often to check log files (minutes). If omitted, falls back to monitor.interval.ms
check.interval.minutes=1

# How often to check (milliseconds) — used only if check.interval.minutes is not set
monitor.interval.ms=60000

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# Global alert behaviour: send alert on first match only (true) or every scan (false)
alert.on.first.match=false

# Optional path to logo image (PNG or JPG). Falls back to embedded default if absent.
logo.path=..\..\logo\IPLogo.jpg

# --- Monitored log files ---
# Add one block per log file (or glob pattern). Number sequentially from 1.
# .name               — display name used in alert emails
# .path               — absolute path or glob pattern (e.g. C:\\Logs\\app.*.log)
# .keywords           — comma-separated keywords to search for
# .case.sensitive     — true | false (default: false)
# .regex.mode         — true | false — treat keywords as regex patterns (default: false)
# .alert.on.first.match — overrides global setting for this file (default: inherits global)
#
# Example:
# monitor.logfile.1.name=Application Log
# monitor.logfile.1.path=C:\\Logs\\app.*.log
# monitor.logfile.1.keywords=ERROR,FATAL,Exception,OutOfMemoryError,SEVERE
# monitor.logfile.1.case.sensitive=false
# monitor.logfile.1.regex.mode=false
# monitor.logfile.1.alert.on.first.match=false

monitor.logfile.1.name=SmartRetail Trunk NonSSO stderr
monitor.logfile.1.path=C:\\Logs\\Errors\\smartretail_trunk_nonsso-stderr.*.log
monitor.logfile.1.keywords=ERROR,FATAL,Exception,OutOfMemoryError,SEVERE
monitor.logfile.1.case.sensitive=false
monitor.logfile.1.regex.mode=false

# Log settings
log.folder=logs
log.level=INFO
log.retention.days=30
log.purge.interval.hours=24
