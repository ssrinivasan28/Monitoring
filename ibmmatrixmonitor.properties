# IBM i Connection Details - supports comma-separated list of hostnames or IP addresses.
ibmi.host=IOHANA,ILUAU,IONO

# Credentials for connecting to IBM i (assumed to be the same across all hosts for simplicity in this version)
ibmi.user=IPGUI
ibmi.password=IPGUI

# Monitoring Thresholds (%)
# Alert if CPU utilization goes above this percentage
ibmi.alert.threshold.cpu=1

# Alert if ASP utilization goes above this percentage (for ASP 1, or overall if not specified)
ibmi.alert.threshold.asp=1

# NEW: Alert if Shared Processor Pool utilization goes above this percentage (e.g., 80 for 80%)
ibmi.alert.threshold.shared.processor.pool=1

# NEW: Alert if Total Jobs in the system exceed this number (e.g., 1000)
ibmi.alert.threshold.total.jobs=600

# NEW: Alert if Active Jobs in the system exceed this number (e.g., 500)
ibmi.alert.threshold.active.jobs=600

# Monitor Settings
# Interval in milliseconds for checking metrics (e.g., 300000 = 5 minutes)
monitor.interval.ms=10000

# Port for the Prometheus metrics exporter
metrics.port=3016

# Daily PDF Report Settings
# Set to true to enable daily report generation and email
report.enabled=true
# Time to send the daily report (24h format HH:mm)
report.send.time=16:12
# Folder where metric CSV data is stored
report.data.folder=data/ibmmatrix
# How many days of CSV data to retain (older rows are pruned)
report.retention.days=7
# Path to logo image file for PDF report (relative to working directory or absolute)
report.logo.path=..\..\logo\IPLogo.jpg