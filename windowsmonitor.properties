# Windows System Monitor Configuration
# Monitors CPU, memory, disk and Windows services on local and remote servers

# Prometheus metrics port
metrics.exporter.port=4010

# Comma-separated list of hosts to monitor (use localhost for this server)
# Example:
# windows.servers.list=localhost,10.0.0.5,SERVER01
windows.servers.list=10.110.26.30,10.110.26.23,10.110.26.20,10.110.26.24,10.110.26.25

# Monitoring interval (seconds)
windows.monitor.interval.seconds=300

# Parallel polling threads (one per server)
windows.poll.threads=5

# Per-host poll timeout in seconds (increase if remote WMI queries are slow)
windows.poll.timeout.seconds=60

# Consecutive check failures required before sending an alert
windows.alert.window.size=3

# Alert thresholds (%)
windows.alert.threshold.cpu=90
windows.alert.threshold.memory=90
windows.alert.threshold.disk=90

# Top N processes to include in CPU alert emails
windows.top.n.processes=5

# Windows services to monitor state (comma-separated service names)
# Example:
# windows.services.to.monitor=Spooler,W3SVC,MSSQLSERVER
windows.services.to.monitor=

# Auto-restart: max attempts before escalating to manual-intervention alert (0 = disabled)
windows.service.max.restart.attempts=3

# CPU kill allow-list: comma-separated process names allowed to be killed on CPU breach
# Leave blank to disable
windows.cpu.killable.processes=

# Auto disk cleanup on disk breach (removes Temp folders). Set false to disable.
windows.disk.cleanup.enabled=true

# --- Per-server credentials (only needed for remote servers) ---
# Example:
# windows.server.SERVER01.username=DOMAIN\\username
# windows.server.SERVER01.password=

windows.server.10.110.26.30.username=Iptccc\\smartretailsa
windows.server.10.110.26.30.password=IPtccc#123654
windows.server.10.110.26.23.username=Iptccc\\smartretailsa
windows.server.10.110.26.23.password=IPtccc#123654
windows.server.10.110.26.20.username=Iptccc\\smartretailsa
windows.server.10.110.26.20.password=IPtccc#123654
windows.server.10.110.26.24.username=Iptccc\\smartretailsa
windows.server.10.110.26.24.password=IPtccc#123654
windows.server.10.110.26.25.username=Iptccc\\smartretailsa
windows.server.10.110.26.25.password=IPtccc#123654

# Client name shown in alert email subject lines
client.name=TCCC

# Path to email configuration file
email.config.path=email.properties

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24

# Daily PDF report
report.enabled=false
report.send.time=07:00
report.data.folder=data/winmonitor
report.retention.days=7
report.logo.path=
