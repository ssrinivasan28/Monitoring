# IBM SQL Threshold Monitor Configuration

# IBM i connection
ibmi.server=
ibmi.user=
ibmi.password=

# Prometheus metrics port
metrics.port=3025

# How often to check (minutes)
monitor.interval.minutes=5

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# Optional path to logo image (PNG or JPG). Falls back to embedded default if absent.
logo.path=C:\\RD\\Monitoring\\Monitoring\\logo\\IPLogo.jpg

# --- Monitored SQL checks ---
# Add one block per check. Replace CHECK_CODE with a unique identifier (no spaces).
# .name              — display name used in alert emails
# .query             — SQL query to execute; alert fires when returned row count breaches threshold
# .threshold         — (optional) row count threshold (default: 1)
# .comparison        — (optional) gt (default, alert when rows > threshold) | gte (alert when rows >= threshold)
# .email.importance  — (optional) High | Normal | Low
# .alert.subject     — (optional) custom email subject, format args: (client, name)
# .alert.body.prefix — (optional) custom email body, format args: (client, name, rowCount, threshold)
#
# Example: alert when 1 or more rows are returned (comparison=gte, threshold=1)
sql.BLANK_DELIVERY_METHOD_DORDLIN.name=BLANK_DELIVERY_METHOD_DORDLIN
sql.BLANK_DELIVERY_METHOD_DORDLIN.query=SELECT DISTINCT DCONUM,DOLNUM,DOLWHS FROM IPDSFILG.DORDLIN WHERE DDMCOD=' ' AND DOLWHS IN (585,100) AND DOLUSH=0 AND DOLUCN=0 AND DOLUOR>0
sql.BLANK_DELIVERY_METHOD_DORDLIN.threshold=1
sql.BLANK_DELIVERY_METHOD_DORDLIN.comparison=gte
sql.BLANK_DELIVERY_METHOD_DORDLIN.email.importance=Normal

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
