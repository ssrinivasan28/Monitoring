# ===============================
# API URL Monitor Configuration
# ===============================

# Prometheus metrics port
metrics.port=4019

# How often to check each URL (seconds)
monitor.interval.seconds=60

# Client name shown in email subject and body
client.name=TCCC

# Optional: path to logo image
logo.path=C:/RD/Monitoring/Monitoring/logo/IPLogo.jpg

# ===============================
# URL Definitions
# Define one block per URL using api.url.<CODE>.<property>
# CODE = short alphanumeric identifier, e.g. ORDERS, HEALTH, LOGIN
# ===============================

# --- SmartCore Bus Monitoring ---
api.url.SMARTCOREBUSMONITORING.name=SmartCore Bus Monitoring
api.url.SMARTCOREBUSMONITORING.url=http://smartcorebus.iptccc.com:7000/monitoring
api.url.SMARTCOREBUSMONITORING.timeout.ms=5000
api.url.SMARTCOREBUSMONITORING.breach.count=1
api.url.SMARTCOREBUSMONITORING.bearer.token=

# --- Example: SmartRetail Orders API ---
