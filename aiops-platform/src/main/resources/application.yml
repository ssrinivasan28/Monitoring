spring:
  application:
    name: aiops-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ipsentinel}
    username: ${SPRING_DATASOURCE_USERNAME:ipsentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:ipsentinel}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.islandpacific.sentinel: DEBUG

sentinel:
  datasource:
    central:
      enabled: true
      tenant_aware: true
      prometheus:
        url: ${CENTRAL_PROMETHEUS_URL:http://localhost:9090}
      loki:
        url: ${CENTRAL_LOKI_URL:http://localhost:3100}
    ssrf:
      allow-private-ips: false
      allowed-ports:
        prometheus: [80, 443, 9090]
        loki: [80, 443, 3100]
        thanos: [80, 443, 9090, 10901, 10902]
    limits:
      max-query-length: 2048
      max-range-duration-days: 30
      min-step-seconds: 1
      max-points-per-series: 11000
      max-fanout-datasources: 10
      backend-timeout-ms: 10000
      max-response-bytes: 5242880
      max-concurrent-queries-global: 100
      max-concurrent-queries-per-tenant: 20
      max-concurrent-backend-requests-per-query: 10
  fleet:
    weights:
      asp: 0.40
      disk: 0.25
      cpu: 0.20
      mem-jobq: 0.15
    critical-threshold: 95.0
    amber-threshold: 75.0
    cutoffs:
      red: 90.0
      amber: 75.0
  llm:
    mode: ${SENTINEL_LLM_MODE:AUTO}
    primary: ${SENTINEL_LLM_PRIMARY:claude}
    secondary: ${SENTINEL_LLM_SECONDARY:local}
    claude:
      api-key: ${CLAUDE_API_KEY:}
      api-url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
      model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
      max-tokens: 2048
      timeout-ms: 10000
    local:
      api-key: ${LOCAL_LLM_KEY:}
      api-url: ${LOCAL_LLM_URL:http://localhost:11434/v1/chat/completions}
      model: ${LOCAL_LLM_MODEL:llama3.1}
      max-tokens: 2048
      timeout-ms: 10000
    embedding:
      provider: ${EMBEDDING_PROVIDER:local}
      api-key: ${EMBEDDING_API_KEY:}
      api-url: ${EMBEDDING_API_URL:http://localhost:11434/v1/embeddings}
      model: ${EMBEDDING_MODEL:nomic-embed-text}
      dimensions: 768
      timeout-ms: 5000

