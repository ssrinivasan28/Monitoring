# Windows Service Monitor Configuration

# Comma-separated list of servers to monitor
monitor.servers=

# Fallback: services checked on any server that has no per-server list below
# Leave blank if every server has its own list
monitor.services=

# How often to check services (in seconds)
monitor.interval.seconds=60

# Number of consecutive failed checks before sending an alert email
monitor.alert.window.size=2

# Auto-restart: number of restart attempts before escalating to a manual-intervention alert
# Set to 0 to disable auto-restart
monitor.max.restart.attempts=3

# Parallel polling threads (one thread per server)
monitor.poll.threads=5

# Prometheus metrics port
metrics.port=4015

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# --- Per-server credentials and service list ---
# Add one block per server listed in monitor.servers above
# Example:
# monitor.server.MYSERVER.username=DOMAIN\\username
# monitor.server.MYSERVER.password=
# monitor.server.MYSERVER.services=Spooler,W3SVC

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
