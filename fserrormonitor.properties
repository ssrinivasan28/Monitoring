# Windows File System Error Monitor Configuration

# Prometheus metrics port
metrics.port=4011

# How often to check (minutes). If omitted, falls back to monitor.interval.ms
check.interval.minutes=5

# How often to check (milliseconds) — used only if check.interval.minutes is not set
monitor.interval.ms=300000

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# Optional path to logo image (PNG or JPG). Falls back to embedded default if absent.
logo.path=..\..\logo\IPLogo.jpg

# --- Monitored locations ---
# Add one block per folder to watch. Replace LOCATION_NAME with a unique identifier (no spaces).
# .path               — absolute path to the folder on this server
# .types              — comma-separated file extensions to watch (e.g. ERR,LOG,DMP)
# .skip.to.emails     — (optional) comma-separated addresses for this location only
# .email.importance   — (optional) High | Normal | Low
#
# Example:
# monitor.location.APP_ERRORS.path=C:\\Logs\\Errors
# monitor.location.APP_ERRORS.types=ERR,LOG
# monitor.location.APP_ERRORS.skip.to.emails=
# monitor.location.APP_ERRORS.email.importance=High

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
