# Windows File System Cardinality Monitor Configuration

# Prometheus metrics port
metrics.port=4012

# How often to check (minutes)
monitor.interval.minutes=5

# Client name shown in alert email subject lines
client.name=

# Path to email configuration file
email.config.path=email.properties

# Optional path to logo image (PNG or JPG). Falls back to embedded default if absent.
logo.path=..\..\logo\IPLogo.jpg

# --- Monitored locations ---
# Add one block per folder. Replace LOCATION_CODE with a unique identifier (no spaces).
# .name                     — display name used in alert emails
# .path                     — absolute path to the folder
# .min.files                — alert if file count drops below this (default: 0)
# .max.files                — alert if file count exceeds this (default: unlimited)
# .file.types               — (optional) comma-separated extensions to count e.g. CSV,XML
# .recursive                — (optional) true | false — scan subfolders (default: false)
# .ignore.zero.file.alert   — (optional) suppress alert when count is zero (default: false)
# .email.importance         — (optional) High | Normal | Low
# .alert.too.few.subject    — (optional) custom email subject when below minimum
# .alert.too.few.body.prefix  — (optional) custom email body prefix when below minimum
# .alert.too.many.subject   — (optional) custom email subject when above maximum
# .alert.too.many.body.prefix — (optional) custom email body prefix when above maximum
#
# Example:
# fs.location.DAILY_REPORTS.name=Daily Reports
# fs.location.DAILY_REPORTS.path=C:\\Data\\Reports\\Daily
# fs.location.DAILY_REPORTS.min.files=0
# fs.location.DAILY_REPORTS.max.files=100
# fs.location.DAILY_REPORTS.file.types=
# fs.location.DAILY_REPORTS.recursive=false
# fs.location.DAILY_REPORTS.ignore.zero.file.alert=false
# fs.location.DAILY_REPORTS.email.importance=Normal
# fs.location.DAILY_REPORTS.alert.too.few.subject=
# fs.location.DAILY_REPORTS.alert.too.few.body.prefix=
# fs.location.DAILY_REPORTS.alert.too.many.subject=
# fs.location.DAILY_REPORTS.alert.too.many.body.prefix=

# Log settings
log.level=INFO
log.folder=logs
log.retention.days=30
log.purge.interval.hours=24
